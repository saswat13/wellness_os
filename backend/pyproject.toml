[project]
name = "form-backend-foundations"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["pydantic==2.14.1", "boto3==1.43.114", "httpx==0.28.1", "PyJWT[crypto]==2.15.1"]

[project.optional-dependencies]
dev = ["ruff==0.17.1", "mypy==2.4.0", "moto[dynamodb]==5.2.4", "types-boto3==1.43.114"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.13"
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
files = ["form_backend"]
